# 本地一键部署（WSL + Docker Desktop）
# 启动:  docker compose --env-file .env.docker up -d --build
# 访问:  http://localhost:8080          （学习者前端）
#        http://localhost:8080/admin/   （管理后台）
#        http://localhost:8000/docs     （后端 API 文档，直连）

services:
  mysql:
    image: mysql:8.0
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_system}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env.docker
    environment:
      # 数据库 / Redis 指向 compose 内部服务（覆盖 env_file 中的 host）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_system}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      # 知识库目录（KNOWLEDGE_BASE_DIRS 默认 ../knowledge-base/cnc_domain → /knowledge-base/cnc_domain）
      - ./knowledge-base:/knowledge-base:ro
      # ChromaDB 索引持久化（CHROMA_PERSIST_DIR 默认 ./chroma_db → /app/chroma_db）
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # 浏览器可达的后端地址：统一走网关同源，默认本机 8080
      NUXT_PUBLIC_API_BASE: ${PUBLIC_BASE_URL:-http://localhost:8080}
      NUXT_PUBLIC_WS_BASE: ${PUBLIC_WS_URL:-ws://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build: ./admin-frontend
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - admin
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  chroma_data:
