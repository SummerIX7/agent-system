# 本地一键部署（WSL + Docker Desktop）
# 启动:  docker compose --env-file .env.docker up -d --build
# 访问:  http://localhost:8080          （学习者前端）
#        http://localhost:8080/admin/   （管理后台）
#        http://localhost:8000/docs     （后端 API 文档，直连）

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-agent_system}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env.docker
    environment:
      # 数据库 / Redis 指向 compose 内部服务（覆盖 env_file 中的 host）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_pass}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-agent_system}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 系统环境变量里的 DeepSeek 密钥透传给容器（compose 从宿主机环境或 --env-file 读取）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # 知识库目录（KNOWLEDGE_BASE_DIRS 默认 ../knowledge-base/cnc_domain → /knowledge-base/cnc_domain）
      - ./knowledge-base:/knowledge-base:ro
      # ChromaDB 索引持久化（CHROMA_PERSIST_DIR 默认 ./chroma_db → /app/chroma_db）
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 学习者前端（Vue3 SPA 静态产物，nginx 托管；请求走相对路径，无环境变量）
  user-frontend:
    build: ./user-frontend
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build: ./admin-frontend
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - user-frontend
      - admin
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  chroma_data:
