# 统一入口网关：单一 origin 反代前端 / 后端 / 管理后台，规避 Nuxt apiBase 跨容器问题。
#   /            → 学习者前端（Nuxt SSR, frontend:3000）
#   /admin/      → 管理后台（静态, admin:80，以 /admin/ 为 base 构建）
#   /api/        → 后端 REST（backend:8000）
#   /ws/         → 后端 WebSocket（backend:8000，需 Upgrade 头）
# 浏览器访问 http://localhost:8080

upstream backend_upstream  { server backend:8000; }
upstream frontend_upstream { server frontend:3000; }
upstream admin_upstream    { server admin:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # 后端 API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket（Agent 实时状态推送）
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # 管理后台静态（尾斜杠使 /admin/ 前缀被剥离后转发到 admin 容器根）
    location /admin/ {
        proxy_pass http://admin_upstream/;
        proxy_set_header Host $host;
    }

    # 学习者前端（Nuxt SSR，含 /_nuxt 静态资源）
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
