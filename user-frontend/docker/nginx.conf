# 学习者前端静态托管：SPA history 路由回退。
# 以 / 为 base 构建，统一网关把根路径代理到本容器。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 深链接（/resources、/knowledge-graph 等）刷新时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的产物可长缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
