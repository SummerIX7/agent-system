<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 项目标识：多智能体协同网络（领域无关，无行业字样）。
       中心枢纽 = 决策调度 Agent，五个卫星节点 = 协同 Agent，
       薄荷绿顶点 = 被点亮/个性化的知识点。
       配色取自设计系统 accent(#4F46E5) + ok 强调(#6EE7B7)。 -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#4F46E5"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="17" x2="16" y2="7.5"/>
    <line x1="16" y1="17" x2="25" y2="14.1"/>
    <line x1="16" y1="17" x2="21.6" y2="24.7"/>
    <line x1="16" y1="17" x2="10.4" y2="24.7"/>
    <line x1="16" y1="17" x2="7" y2="14.1"/>
  </g>
  <circle cx="16" cy="7.5" r="2.3" fill="#6EE7B7"/>
  <circle cx="25" cy="14.1" r="2" fill="#FFFFFF"/>
  <circle cx="21.6" cy="24.7" r="2" fill="#FFFFFF"/>
  <circle cx="10.4" cy="24.7" r="2" fill="#FFFFFF"/>
  <circle cx="7" cy="14.1" r="2" fill="#FFFFFF"/>
  <circle cx="16" cy="17" r="3.6" fill="#FFFFFF"/>
</svg>
